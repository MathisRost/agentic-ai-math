<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#17212b}.small{font-size:17px}.body{font-size:22px}.title{font-size:24px;font-weight:600}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#526778"/></marker></defs><text x="30" y="35" class="title" text-anchor="start">A single model interaction</text><rect x="30" y="60" width="250" height="65" rx="5" fill="#f3f6f8" stroke="#a9bac8"/><text x="155.0" y="99.5" class="body" text-anchor="middle">Input and context</text><path d="M280,92 L410,92" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/><rect x="410" y="60" width="300" height="65" rx="5" fill="#f3f6f8" stroke="#a9bac8"/><text x="560.0" y="99.5" class="body" text-anchor="middle">Language model</text><path d="M710,92 L840,92" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/><rect x="840" y="60" width="320" height="65" rx="5" fill="#f3f6f8" stroke="#a9bac8"/><text x="1000.0" y="99.5" class="body" text-anchor="middle">Response</text><text x="30" y="190" class="title" text-anchor="start">An agent working towards a goal</text><rect x="30" y="220" width="250" height="90" rx="5" fill="#f3f6f8" stroke="#a9bac8"/><text x="155.0" y="272.0" class="body" text-anchor="middle">Goal and current state</text><path d="M280,265 L340,265" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="220" width="250" height="90" rx="5" fill="#f3f6f8" stroke="#a9bac8"/><text x="465.0" y="259.0" class="body" text-anchor="middle">Model selects</text><text x="465.0" y="285.0" class="body" text-anchor="middle">next action</text><path d="M590,265 L650,265" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/><rect x="650" y="220" width="250" height="90" rx="5" fill="#f3f6f8" stroke="#a9bac8"/><text x="775.0" y="259.0" class="body" text-anchor="middle">Harness executes</text><text x="775.0" y="285.0" class="body" text-anchor="middle">a tool call</text><path d="M900,265 L960,265" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/><rect x="960" y="220" width="210" height="90" rx="5" fill="#f3f6f8" stroke="#a9bac8"/><text x="1065.0" y="259.0" class="body" text-anchor="middle">Environment</text><text x="1065.0" y="285.0" class="body" text-anchor="middle">files, code, Lean</text><path d="M1065,310 L1065,365 L465,365 L465,312" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/><text x="755" y="352" class="small" text-anchor="middle">Observed results update the next decision</text><text x="30" y="425" class="small" text-anchor="start">The agent can repeat the loop, revise its plan, or return a result. Tools depend on the configured environment.</text></svg>